<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · GPU Monitor</title>
    <link rel="stylesheet" href="/login-assets/login.css">
    <script src="/login-assets/ui.js" defer></script>
    <script src="/login-assets/login.js" defer></script>
</head>
<body>
    <header class="login-header">
        <div class="brand"><span class="brand-mark"><i data-lucide="cpu" aria-hidden="true"></i></span>GPU Monitor</div>
    </header>
    <main>
        <div class="login-symbol"><i data-lucide="key-round" aria-hidden="true"></i></div>
        <h1>SSH 密钥登录</h1>
        <form id="login-form" autocomplete="off">
            <label class="field-label" for="private-key">私钥文件</label>
            <label class="file-picker" id="file-picker">
                <i data-lucide="file-key-2" aria-hidden="true"></i>
                <span class="file-name" id="file-name">选择 SSH 私钥文件</span>
                <input id="private-key" type="file" required aria-describedby="status file-name">
            </label>
            <label class="field-label password-label" for="passphrase">私钥密码<span class="optional">可选</span></label>
            <div class="password-field">
                <input id="passphrase" type="password" autocomplete="off" placeholder="输入私钥密码">
                <button id="toggle-passphrase" type="button" title="显示密码" aria-label="显示密码" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button>
            </div>
            <button class="submit-button" id="submit" type="submit"><span>登录</span><i class="ready-icon" data-lucide="arrow-right" aria-hidden="true"></i><i class="busy-icon" data-lucide="loader-circle" aria-hidden="true"></i></button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
